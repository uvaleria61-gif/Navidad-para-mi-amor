
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Para Daney ♡</title>
<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  padding: 25px 16px;
  min-height: 100vh;
  background: linear-gradient(145deg,#fff5fa,#f2edff,#edf6ff);
  font-family: Georgia, serif;
  color: #806b91;
  text-align: center;
}

header { margin: 35px auto 30px; }

.small {
  font: 11px Arial,sans-serif;
  letter-spacing: 3px;
  color: #b69bbd;
}

h1 {
  font-size: 32px;
  font-weight: normal;
  line-height: 1.3;
  color: #a184b5;
}

.subtitle {
  font-size: 15px;
  color: #ae9bbd;
  font-style: italic;
}

.calendar {
  max-width: 430px;
  margin: 30px auto;
  display: grid;
  grid-template-columns: repeat(4,1fr);
  gap: 12px;
}

.day {
  aspect-ratio: 1;
  border: 1px solid #ffffff;
  border-radius: 17px;
  background: #f8e8f1;
  color: #a17f9e;
  font-size: 23px;
  cursor: pointer;
  box-shadow: 0 4px 12px #bca9c522;
}

.day:nth-child(3n+2) { background:#eae1f6; }
.day:nth-child(3n) { background:#e2effa; }

.day:disabled {
  opacity: .65;
  cursor: default;
}

.day.special {
  background: #d9c4eb;
  border: 1px solid white;
  font-size: 27px;
}

footer {
  font-size: 13px;
  color: #b19dbb;
  margin: 30px 0;
}

.modal {
  display: none;
  position: fixed;
  inset: 0;
  background: #65536b99;
  align-items: center;
  justify-content: center;
  padding: 20px;
}

.modal-content {
  background: #fffafd;
  border-radius: 24px;
  padding: 30px 22px;
  max-width: 350px;
  width: 100%;
  box-shadow: 0 10px 40px #51405b33;
}

.modal h2 {
  font-weight: normal;
  color: #a184b5;
}

.modal p {
  line-height: 1.8;
  font-size: 16px;
}

.close {
  border: none;
  border-radius: 20px;
  padding: 11px 25px;
  background: #eadcf4;
  color: #806b91;
  font-size: 14px;
}
</style>
</head>

<body>

<header>
  <div class="small">A LITTLE CHRISTMAS FOR YOU</div>
  <h1>24 sorpresas<br>para ti mi amor</h1>
  <div class="subtitle">Hecho pensando en ti ♡</div>
</header>

<div class="calendar" id="calendar"></div>

<footer>
  Cada día es una pequeña razón para sonreír ♡
</footer>

<div class="modal" id="modal">
  <div class="modal-content">
    <div style="font-size:30px">♡</div>
    <h2 id="title"></h2>
    <p id="message"></p>
    <button class="close" onclick="closeModal()">Cerrar ♡</button>
  </div>
</div>

<script>
const surprises = [


const surprises = [
  "💌 Día 1: Una carta para recordarte lo especial que eres para mí. Desde que llegaste a mi vida, muchas cosas son más bonitas.",
  "📸 Día 2: Una de mis fotos favoritas contigo. Porque hay momentos que quisiera guardar para siempre.",
  "🎵 Día 3: Una canción que me hace pensar en ti. Escúchala y recuerda que siempre hay un pedacito de mí en ella.",
  "💗 Día 4: Reto de amor: dime tres cosas que te gustan de nosotros y yo te diré tres que amo de ti.",
  "🎙️ Día 5: Un audio mío diciéndote algo que quizás no te digo todos los días: cuánto te amo.",
  "🌷 Día 6: Cinco razones por las que me encantas: tu forma de ser, tu sonrisa, tu mirada, tu cariño y esa manera única que tienes de hacerme feliz.",
  "🎬 Día 7: Un videíto especial para ti. Una pequeña sorpresa hecha con mucho amor.",
  "💕 Día 8: Si pudiera repetir un momento contigo, elegiría uno en el que nos hayamos reído hasta que nos doliera la barriga.",
  "🎮 Día 9: Juego: ¿qué prefieres? ¿Un abrazo mío de cinco minutos o cien besitos?",
  "📷 Día 10: Una foto especial y una pequeña historia detrás de ella.",
  "💌 Día 11: Quiero que sepas que no necesito días perfectos para ser feliz contigo. Me basta con tenerte.",
  "🎧 Día 12: Una canción para dedicarte. Porque algunas melodías dicen lo que a veces no sé explicar.",
  "✨ Día 13: Mi deseo para nosotros: seguir construyendo recuerdos, superando dificultades y eligiéndonos cada día.",
  "🎙️ Día 14: Un mensaje de voz para que puedas escucharme cuando me extrañes.",
  "💞 Día 15: Completa la frase: 'Nuestro momento más bonito fue...'. Después me cuentas tu respuesta.",
  "📸 Día 16: Una colección de fotos de momentos que quiero volver a vivir contigo.",
  "🌙 Día 17: Si estuvieras aquí ahora, te daría un abrazo largo y no te soltaría tan rápido.",
  "🎬 Día 18: Un video con recuerdos, momentos y razones por las que eres tan importante para mí.",
  "🎲 Día 19: Adivinanza: ¿qué cosa se hace más grande cuanto más se comparte? ¡El amor!",
  "💗 Día 20: Gracias por existir, por ser tú y por hacer parte de mi historia.",
  "🎵 Día 21: Una canción para imaginar todos los lugares que todavía nos faltan por conocer juntos.",
  "💌 Día 22: Una carta sobre todo lo que sueño vivir a tu lado.",
  "🎁 Día 23: Una pista de la sorpresa que te espera mañana: prepárate para algo muy especial.",
  "❤️ Día 24: Mi regalo final: no es solamente una sorpresa, es mi promesa de seguir creando recuerdos hermosos contigo. Te amo, Daney."
];

const calendar = document.getElementById("calendar");

for (let i = 1; i <= 24; i++) {
  const button = document.createElement("button");
  button.className = i === 24 ? "day special" : "day";
  button.textContent = i === 24 ? "♡" : i;

  const today = new Date();
  const unlocked = today.getMonth() === 11 && today.getDate() >= i;

  
button.disabled = !unlocked;

button.onclick = () => {
  const title = document.getElementById("title");
  const message = document.getElementById("message");

  title.textContent = i === 24 ? "Para mi Daney ♡" : "Día " + i;

  message.innerHTML = "";

  const content = document.createElement("p");
  content.textContent = surprises[i - 1];
  message.appendChild(content);

  // Espacio para agregar fotos, videos, audios y juegos
  if (i === 2 || i === 10 || i === 16) {
    const photo = document.createElement("img");
    photo.src = "fotos/foto" + i + ".jpg";
    photo.alt = "Un recuerdo especial";
    photo.style.width = "100%";
    photo.style.borderRadius = "15px";
    message.appendChild(photo);
  }

  if (i === 5 || i === 14) {
    const audio = document.createElement("audio");
    audio.src = "audios/audio" + i + ".mp3";
    audio.controls = true;
    audio.style.width = "100%";
    message.appendChild(audio);
  }

  if (i === 7 || i === 18) {
    const video = document.createElement("video");
    video.src = "videos/video" + i + ".mp4";
    video.controls = true;
    video.style.width = "100%";
    video.style.borderRadius = "15px";
    message.appendChild(video);
  }

  if (i === 4 || i === 9 || i === 15 || i === 19) {
    const game = document.createElement("button");
    game.textContent = "💕 Toca aquí para descubrir tu reto";
    game.onclick = () => {
      alert("¡Tu reto es darme muchos besitos y un abrazo enorme! ❤️");
    };
    message.appendChild(game);
  }

  document.getElementById("modal").style.display = "flex";
};

calendar.appendChild(button);

}

function closeModal() {
  document.getElementById("modal").style.display = "none";
}
</script>

</body>
</html>
